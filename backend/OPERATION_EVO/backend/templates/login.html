<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connexion — Operation EVO</title>
  <style>
    :root { --primary:#c8102e; --surface:#fff; --muted:#64748b; --line:#e2e8f0; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; font-family:Inter,Segoe UI,Arial,sans-serif; background:linear-gradient(135deg,#f8fafc,#fff1f2); color:#172033; }
    .card { width:min(460px,100%); background:var(--surface); border:1px solid var(--line); border-radius:24px; box-shadow:0 24px 70px rgba(15,23,42,.12); overflow:hidden; }
    .hero { padding:28px; background:linear-gradient(135deg,var(--primary),#8f0a20); color:#fff; }
    .hero h1 { margin:0 0 8px; font-size:28px; }
    .hero p { margin:0; opacity:.85; line-height:1.5; }
    form { padding:28px; }
    label { display:block; margin:0 0 7px; font-weight:700; font-size:14px; }
    input { width:100%; padding:12px 14px; border:1px solid var(--line); border-radius:12px; font:inherit; margin-bottom:18px; }
    input:focus { outline:3px solid rgba(200,16,46,.12); border-color:var(--primary); }
    button { width:100%; border:0; border-radius:12px; padding:12px 16px; background:var(--primary); color:#fff; font:inherit; font-weight:800; cursor:pointer; }
    .error { margin:0 0 16px; padding:11px 12px; border-radius:10px; background:#fff1f2; color:#9f1239; border:1px solid #fecdd3; }
    .demo { display:grid; gap:10px; margin-top:18px; }
    .account { padding:12px 13px; border-radius:12px; background:#f8fafc; color:var(--muted); font-size:13px; line-height:1.55; }
    .account strong { color:#334155; }
    code { color:#334155; }
  </style>
</head>
<body>
  <main class="card">
    <section class="hero"><h1>Operation EVO</h1><p>Chaque rôle est redirigé vers son propre espace.</p></section>
    <form method="post" autocomplete="on">
      {% if error %}<div class="error">{{ error }}</div>{% endif %}
      <label for="email">Adresse email</label>
      <input id="email" name="email" type="email" required autofocus placeholder="nom@operation-evo.local">
      <label for="password">Mot de passe</label>
      <input id="password" name="password" type="password" required>
      <button type="submit">Se connecter</button>
      <div class="demo">
        <div class="account"><strong>Administrateur</strong><br><code>admin@operation-evo.local</code><br><code>Admin123!</code></div>
        <div class="account"><strong>Utilisateur</strong><br><code>agent@operation-evo.local</code><br><code>Agent123!</code></div>
      </div>
    </form>
  </main>
</body>
</html>
